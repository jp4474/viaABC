# conf/data/lotka.yaml - Most common working version
datamodule:
  _target_: src.data.datamodule.SimulationDataModule
  data_dir: ${paths.data_dir}/spatial2D
  batch_size: ${..batch_size}
  num_workers: ${..num_workers}
  pin_memory: ${..pin_memory}
  # ...
  dataset:
    _target_: src.data.components.dataset.Spatial2DDataset
    data_dir: ${..data_dir} 
    prefix: train 
    temporal: ${system.use_time_series}
    expected_num_frames: ${system.num_frames}
observation_sample: [sample_1, sample_2, sample_3, sample_4]
observation_samples:
  sample_1:
    image: ${paths.data_dir}/spatial2D/img1.jpg
    txt: ${paths.data_dir}/spatial2D/initial_grid1_cpp.txt
  sample_2:
    image: ${paths.data_dir}/spatial2D/img2.jpg
    txt: ${paths.data_dir}/spatial2D/initial_grid2_cpp.txt
  sample_3:
    image: ${paths.data_dir}/spatial2D/img3.jpg
    txt: ${paths.data_dir}/spatial2D/initial_grid3_cpp.txt
  sample_4:
    image: ${paths.data_dir}/spatial2D/img4.jpg
    txt: ${paths.data_dir}/spatial2D/initial_grid4_cpp.txt
