# @package _global_

# Small, numerically valid Spatial2D debugging setup for deep inference/system
# issues. Keeps the run tiny enough for inspection while still exercising the
# real viaABC proposal, weighting, and simulator code paths.

defaults:
  - default

task_name: "debug_spatial2d"

system:
  pooling_method: no_cls
  metric: pairwise_cosine
  sample_id: sample_2
  time_space: [0, 6, 12, 18, 24]

model:
  net:
    in_chans: 6
    num_frames: 5
    t_patch_size: 1
    pred_t_dim: 5
    img_size: 1200
    patch_size: 16

data:
  observation_sample: sample_2
  batch_size: 1
  num_workers: 0
  pin_memory: False

abc:
  num_particles: 100
  k: 10
  q_threshold: 0.90
  max_generations: 20
  num_workers: 16
  simulation_batch_size: 10
  max_pending_simulations: 20

hydra:
  job:
    name: debug_spatial2d
