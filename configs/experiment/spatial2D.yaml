# @package _global_

# to execute this experiment run:
# python train.py experiment=example

defaults:
  - override /system: spatial2D
  - override /data: spatial2D
  - override /model: spatial2D
  - override /callbacks: default
  - override /trainer: ddp

# Reading this file top-down is the easiest way to understand the training
# architecture: the data config chooses the observation/simulation domain,
# the model config defines the MAE encoder used later by viaABC, and the
# trainer block controls optimization/runtime policy.

# all parameters below will be merged with parameters from default configurations set above
# this allows you to overwrite only specified parameters

tags: ["spatial2D", "MAE"]

hydra:
  run:
    dir: ${paths.log_dir}/${task_name}/runs/spatial2D_VAE

seed: 12345

trainer:
  max_steps: 40000
  fast_dev_run: false 
  precision: bf16-mixed
  log_every_n_steps: 10
  max_epochs: -1
  devices: 2
  strategy: ddp
  num_nodes: 1
  sync_batchnorm: true
  accumulate_grad_batches: 2
  gradient_clip_val: 10.0

model:
  net:
    # `in_chans=6` / `out_chans=6` matches Spatial2D's one-hot state maps.
    # That alignment is what makes the same encoder reusable for both
    # reconstruction pretraining and downstream simulator comparison.
    patch_size: 16
    in_chans: 6
    out_chans: 6
    embed_dim: 384
    depth: 12
    num_heads: 6
    decoder_embed_dim: 256
    decoder_depth: 4
    decoder_num_heads: 8
    mlp_ratio: 4.0
    mask_ratio: 0.75
    kld_weight: 1.0
    z_type: vae

  optimizer:
    betas: [0.9, 0.995]
    lr: 0.00001
    weight_decay: 0.05

  scheduler:
    warmup_steps: 12000
    max_steps: ${trainer.max_steps}
    min_lr: 0.000001
    max_lr: 0.0005

  compile: false
  vae_warmup_steps: 24000
  annealing: true # false means no annealing

data:
  batch_size: 10
  num_workers: 2
  pin_memory: false

callbacks:
  gpu_memory_monitor:
    every_n_train_steps: 10

