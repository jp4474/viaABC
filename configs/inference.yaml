defaults:
  - _self_
  - data: lotka
  - system: lotka_volterra
  - paths: default
  - inference: null
  - optional debug: null

# --- Training Run Location ---
run_folder_path: null
checkpoint_substr: last

# --- System Overrides (NO transform here) ---
system:
  pooling_method: no_cls
  metric: pairwise_cosine

# --- viaABC Parameters ---
abc:
  num_particles: 1000
  k: 10
  q_threshold: 0.999
  max_generations: 20
  num_workers: null
  simulation_batch_size: null
  max_pending_simulations: null

# --- Output Folder ---
folder_name: ${run_folder_path}/inference_output
